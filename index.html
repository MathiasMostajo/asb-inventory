<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>ASB Inventory</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0"></script>
<script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>
<style>
:root{--bg:#000;--bg2:#080d1a;--bg3:#121942;--bg4:#1a2255;--border:#1e2a5a;--border2:#2a3a7a;--text:#fff;--text2:#bec9ce;--text3:#7a8a9a;--accent:#38b6ff;--accent2:#2090dd;--accent-dim:rgba(56,182,255,.1);--accent-dim2:rgba(56,182,255,.2);--brand:#03306b;--red:#f87171;--red-dim:rgba(248,113,113,.1);--orange:#fb923c;--orange-dim:rgba(251,146,60,.1);--green:#34d399;--green-dim:rgba(52,211,153,.1);--radius:10px;--radius-sm:6px;--shadow:0 4px 24px rgba(0,0,0,.5)}
body.light{--bg:#f0f2f5;--bg2:#fff;--bg3:#e8ecf1;--bg4:#dce1e8;--border:#c8d0dc;--border2:#aeb9c8;--text:#111827;--text2:#4b5563;--text3:#6b7280;--accent:#03306b;--accent2:#0a4a9e;--accent-dim:rgba(3,48,107,.08);--accent-dim2:rgba(3,48,107,.15);--brand:#03306b;--red:#dc2626;--red-dim:rgba(220,38,38,.08);--orange:#ea580c;--orange-dim:rgba(234,88,12,.08);--green:#16a34a;--green-dim:rgba(22,163,74,.08);--shadow:0 2px 12px rgba(0,0,0,.08)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;transition:background .3s,color .3s}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 30% 20%,rgba(3,48,107,.3) 0%,transparent 60%),var(--bg);padding:20px}
.login-card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:48px 40px;width:100%;max-width:420px;box-shadow:var(--shadow)}
.login-card .logo{text-align:center;margin-bottom:32px}
.login-card .logo h1{font-size:28px;font-weight:800;letter-spacing:-.5px;color:var(--accent)}
.login-card .logo p{color:var(--text3);font-size:14px;margin-top:4px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:500;color:var(--text2);margin-bottom:6px}
.form-group input,.form-group select{width:100%;padding:12px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:'Outfit',sans-serif;font-size:15px;outline:none;transition:border-color .2s}
.form-group input:focus,.form-group select:focus{border-color:var(--accent)}
.form-group select option{background:var(--bg2);color:var(--text)}
.color-select-wrap{display:flex;gap:8px;align-items:center}.color-select-wrap select{flex:1}
.color-preview{width:40px;height:40px;border-radius:var(--radius-sm);border:1px solid var(--border);flex-shrink:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:var(--radius-sm);font-family:'Outfit',sans-serif;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .2s}
.btn-primary{background:var(--accent);color:#000;width:100%}body.light .btn-primary{color:#fff}
.btn-primary:hover{opacity:.85}
.btn-secondary{background:var(--bg3);color:var(--text);border:1px solid var(--border)}.btn-secondary:hover{border-color:var(--border2);background:var(--bg4)}
.btn-danger{background:var(--red-dim);color:var(--red);border:1px solid rgba(248,113,113,.2)}
.btn-sm{padding:8px 14px;font-size:13px}
.btn-icon{width:36px;height:36px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);background:var(--bg3);border:1px solid var(--border);color:var(--text2);cursor:pointer;transition:all .2s}.btn-icon:hover{color:var(--text);border-color:var(--border2)}
.login-toggle{text-align:center;margin-top:20px;font-size:14px;color:var(--text3)}.login-toggle a{color:var(--accent);cursor:pointer}
.login-error{background:var(--red-dim);border:1px solid rgba(248,113,113,.2);color:var(--red);padding:10px 14px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:16px;display:none}
.pending-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.pending-card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:48px;text-align:center;max-width:420px}
.pending-card h2{color:var(--accent);margin-bottom:12px}.pending-card p{color:var(--text2);font-size:15px;margin-bottom:20px}
.app-wrap{display:none;min-height:100vh}
.topbar{height:60px;background:var(--brand);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100}
.topbar-left{display:flex;align-items:center;gap:16px}
.topbar-brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;color:#fff;letter-spacing:-.5px}
.topbar-brand img{width:30px;height:30px;border-radius:50%;object-fit:cover}
.topbar-nav{display:flex;gap:2px;flex-wrap:wrap}
.topbar-nav button{padding:6px 12px;background:none;border:none;color:rgba(255,255,255,.55);font-family:'Outfit',sans-serif;font-size:13px;font-weight:500;cursor:pointer;border-radius:var(--radius-sm);transition:all .2s}
.topbar-nav button:hover{color:rgba(255,255,255,.8);background:rgba(255,255,255,.1)}
.topbar-nav button.active{color:#fff;background:rgba(255,255,255,.15)}
.topbar-right{display:flex;align-items:center;gap:8px}
.topbar-user{font-size:12px;color:rgba(255,255,255,.55)}
.topbar-logout{padding:5px 12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:var(--radius-sm);color:rgba(255,255,255,.65);font-family:'Outfit',sans-serif;font-size:12px;cursor:pointer}
.topbar-logout:hover{border-color:var(--red);color:var(--red)}
.tbtn{padding:5px 10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:var(--radius-sm);color:rgba(255,255,255,.65);font-size:12px;cursor:pointer;line-height:1;font-family:'Outfit',sans-serif;font-weight:600}
.content{max-width:1200px;margin:0 auto;padding:24px}
.page{display:none}.page.active{display:block}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.page-title{font-size:22px;font-weight:700;letter-spacing:-.5px}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.stat-card .stat-label{font-size:12px;color:var(--text3);font-weight:500;margin-bottom:6px}
.stat-card .stat-value{font-size:26px;font-weight:700;color:var(--text);font-family:'JetBrains Mono',monospace}
.charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:20px}
.chart-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.chart-card h3{font-size:14px;font-weight:600;color:var(--text2);margin-bottom:14px}
.chart-card canvas{max-height:240px}
.alert-banner{background:var(--orange-dim);border:1px solid rgba(251,146,60,.3);border-radius:var(--radius);padding:14px 18px;margin-bottom:16px}
.alert-banner h4{color:var(--orange);font-size:13px;margin-bottom:6px}
.alert-banner ul{list-style:none;padding:0}.alert-banner li{font-size:13px;color:var(--text2);padding:3px 0}
.boxes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.box-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:18px;cursor:pointer;transition:all .2s}
.box-card:hover{border-color:var(--border2);transform:translateY(-2px)}
.box-card-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:6px}
.box-card-name{font-size:15px;font-weight:600;color:var(--text);flex:1}
.status-badge{padding:3px 8px;border-radius:16px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.status-clean{background:var(--green-dim);color:var(--green)}.status-dirty{background:var(--orange-dim);color:var(--orange)}
.box-card-loc{font-size:12px;color:var(--text3);margin-bottom:6px}
.box-card-stats{display:flex;gap:14px;margin-top:6px}.box-card-stat{font-size:13px;color:var(--text3)}.box-card-stat span{font-weight:600;color:var(--text2);font-family:'JetBrains Mono',monospace}
.box-card-chart{margin-top:8px;height:5px;border-radius:3px;background:var(--bg3);overflow:hidden;display:flex}.box-card-chart div{height:100%}
.view-toggle{display:flex;border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;margin-bottom:16px}
.view-toggle button{padding:8px 16px;background:var(--bg3);border:none;color:var(--text2);font-family:'Outfit',sans-serif;font-size:13px;font-weight:500;cursor:pointer}.view-toggle button.active{background:var(--accent-dim);color:var(--accent)}
.detail-header{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.detail-back{width:38px;height:38px;display:flex;align-items:center;justify-content:center;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;color:var(--text2);font-size:18px}.detail-back:hover{border-color:var(--accent);color:var(--accent)}
.detail-title{font-size:20px;font-weight:700;flex:1}
.detail-actions{display:flex;gap:6px}
.detail-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.detail-stat{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:12px;text-align:center}
.detail-stat .ds-val{font-size:22px;font-weight:700;font-family:'JetBrains Mono',monospace}
.detail-stat .ds-label{font-size:11px;color:var(--text3);margin-top:2px}
.items-table-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow-x:auto;margin-bottom:20px}
.items-table{width:100%;border-collapse:collapse}
.items-table th{background:var(--bg3);padding:10px 14px;text-align:left;font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border)}
.items-table td{padding:10px 14px;font-size:13px;border-bottom:1px solid var(--border);color:var(--text2)}
.items-table tr:last-child td{border-bottom:none}
.items-table tr:hover td{background:var(--bg3)}
.items-table .qty{font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--text)}
.items-table .actions-cell{display:flex;gap:4px}
.color-dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:middle;border:1px solid rgba(255,255,255,.12)}
body.light .color-dot{border-color:rgba(0,0,0,.12)}
.empty-state{text-align:center;padding:40px 20px;color:var(--text3)}.empty-state p{font-size:14px;margin-bottom:14px}
.qr-section{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:20px;display:flex;align-items:center;gap:18px}
.co-search{width:100%;padding:10px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:'Outfit',sans-serif;font-size:14px;outline:none;margin-bottom:12px}.co-search:focus{border-color:var(--accent)}.co-search::placeholder{color:var(--text3)}
.checkout-filters{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.checkout-filters button{padding:8px 16px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text2);font-family:'Outfit',sans-serif;font-size:13px;font-weight:500;cursor:pointer}.checkout-filters button.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
.checkout-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.checkout-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;text-align:center;cursor:pointer;transition:all .15s;user-select:none;-webkit-user-select:none;position:relative;overflow:hidden}
.checkout-card:hover{border-color:var(--accent)}.checkout-card:active{transform:scale(.96);background:var(--accent-dim)}
.checkout-card .cc-type{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);margin-bottom:4px}
.checkout-card .cc-color{display:flex;align-items:center;justify-content:center;gap:5px;font-size:13px;font-weight:600;color:var(--text);margin-bottom:3px}
.checkout-card .cc-size{font-size:18px;font-weight:700;font-family:'JetBrains Mono',monospace;margin-bottom:3px}
.checkout-card .cc-qty{font-size:12px;color:var(--text3)}.checkout-card .cc-qty span{color:var(--accent);font-family:'JetBrains Mono',monospace;font-weight:600}
.checkout-card.out-of-stock{opacity:.25;pointer-events:none}
.checkout-card .cc-flash{position:absolute;inset:0;background:var(--accent);opacity:0;transition:opacity .3s;pointer-events:none}.checkout-card.flashing .cc-flash{opacity:.2}
.checkout-undo{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:12px 24px;background:var(--bg2);border:1px solid var(--accent);border-radius:var(--radius);color:var(--accent);font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;cursor:pointer;z-index:200;box-shadow:0 8px 32px rgba(0,0,0,.4);display:none}.checkout-undo.show{display:block}
.settings-tabs{display:flex;gap:3px;margin-bottom:16px;flex-wrap:wrap}
.settings-tabs button{padding:8px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text2);font-family:'Outfit',sans-serif;font-size:12px;font-weight:500;cursor:pointer}
.settings-tabs button.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
.settings-section{display:none}.settings-section.active{display:block}
.colors-grid,.types-grid,.locations-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.color-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;display:flex;align-items:center;gap:10px}
.color-card .color-swatch{width:32px;height:32px;border-radius:6px;border:1px solid rgba(255,255,255,.1);flex-shrink:0}
body.light .color-card .color-swatch{border-color:rgba(0,0,0,.1)}
.color-card .color-names{flex:1}.color-card .en{font-size:13px;font-weight:600}.color-card .fr{font-size:11px;color:var(--text3)}
.type-card,.loc-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;display:flex;align-items:center;justify-content:space-between}
.type-card .type-name,.loc-card .loc-name{font-size:14px;font-weight:600}
.loc-card .loc-desc{font-size:11px;color:var(--text3)}.loc-card .loc-info{flex:1}
.users-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.user-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;display:flex;align-items:center;gap:10px}
.user-card .user-info{flex:1}.user-card .user-email{font-size:13px;font-weight:500}.user-card .user-role{font-size:11px;color:var(--text3);text-transform:uppercase}
.role-badge{padding:2px 7px;border-radius:10px;font-size:10px;font-weight:600}
.role-super{background:rgba(56,182,255,.15);color:var(--accent)}.role-admin{background:var(--green-dim);color:var(--green)}.role-pending{background:var(--orange-dim);color:var(--orange)}
.history-filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.history-filters select,.history-filters input{padding:8px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:'Outfit',sans-serif;font-size:13px}
.bulk-sizes{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;margin-top:12px}
.bulk-size-item{text-align:center}.bulk-size-item label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:4px}
.bulk-size-item input{width:100%;padding:8px;text-align:center;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:14px}
.qty-modal-body{display:flex;align-items:center;justify-content:center;gap:16px;padding:20px 0}
.qty-modal-body button{width:48px;height:48px;border-radius:50%;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:24px;cursor:pointer;font-family:'Outfit',sans-serif}.qty-modal-body button:hover{border-color:var(--accent)}
.qty-modal-body .qty-val{font-size:36px;font-weight:700;font-family:'JetBrains Mono',monospace;min-width:60px;text-align:center}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}.modal-overlay.show{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:28px;width:100%;max-width:480px;box-shadow:0 16px 48px rgba(0,0,0,.5);max-height:90vh;overflow-y:auto}
.modal h2{font-size:18px;font-weight:700;margin-bottom:16px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.toast{position:fixed;bottom:20px;right:20px;padding:12px 18px;border-radius:var(--radius);font-size:13px;font-weight:500;z-index:2000;transform:translateY(20px);opacity:0;transition:all .3s;max-width:360px}.toast.show{transform:translateY(0);opacity:1}
.toast-success{background:var(--accent-dim2);color:var(--accent);border:1px solid rgba(56,182,255,.3)}
.toast-error{background:var(--red-dim);color:var(--red);border:1px solid rgba(248,113,113,.3)}
@media print{body{background:#fff!important}.topbar,.toast,.modal-overlay,.checkout-undo{display:none!important}.content{padding:0}.page{display:none!important}#page-print{display:block!important}.print-qr{text-align:center;padding:40px}.print-qr h2{color:#000}.print-qr p{color:#333}}
@media(max-width:768px){.topbar{padding:0 10px;flex-wrap:wrap;height:auto;min-height:52px;padding:6px 10px}.topbar-left{gap:6px}.topbar-nav button{padding:5px 7px;font-size:11px}.topbar-user{display:none}.content{padding:14px}.page-title{font-size:18px}.stat-card .stat-value{font-size:20px}.charts-grid,.boxes-grid{grid-template-columns:1fr}.login-card{padding:28px 20px}.items-table th,.items-table td{padding:8px 10px;font-size:12px}.detail-actions{width:100%}.detail-actions .btn{flex:1}.checkout-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}.qr-section{flex-direction:column;text-align:center}}
@media(max-width:480px){.topbar-brand{font-size:14px}.topbar-brand span{display:none}.stats-row{grid-template-columns:repeat(2,1fr)}.checkout-grid{grid-template-columns:repeat(2,1fr)}}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>
<div id="loginView" class="login-wrap"><div class="login-card">
<div class="logo"><div id="loginLogo"></div><h1>ASB Inventory</h1><p>AS Blainville Equipment Manager</p></div>
<div class="login-error" id="loginError"></div>
<div id="loginForm"></div><div id="signupForm" style="display:none"></div>
</div></div>
<div id="pendingView" class="pending-wrap" style="display:none"><div class="pending-card"><h2 id="pendH"></h2><p id="pendP"></p><button class="btn btn-secondary" onclick="handleLogout()" id="pendOut"></button></div></div>
<div id="appView" class="app-wrap">
<div class="topbar"><div class="topbar-left">
<div class="topbar-brand"><img id="topbarLogo" src="" style="display:none"><span>ASB Inventory</span></div>
<nav class="topbar-nav" id="navBar"></nav></div>
<div class="topbar-right"><button class="tbtn" onclick="toggleLang()" id="langBtn">FR</button><button class="tbtn" onclick="toggleTheme()">☀</button><span class="topbar-user" id="userEmail"></span><button class="topbar-logout" onclick="handleLogout()" id="logoutBtn">Out</button></div></div>
<div class="content">
<div class="page active" id="page-dashboard"></div>
<div class="page" id="page-boxes"></div>
<div class="page" id="page-detail"></div>
<div class="page" id="page-checkout">
<div class="page-header"><h2 class="page-title" id="coTitle"></h2></div>
<input type="text" class="co-search" id="coSearch" oninput="renderCO()">
<div class="checkout-filters" id="checkoutFilters"></div>
<div class="checkout-grid" id="checkoutGrid"></div></div>
<button class="checkout-undo" id="undoBtn" onclick="undoLast()"></button>
<div class="page" id="page-history"></div>

async function loadData(){const[bx,it,co,ty,lo,lg,pr,st,sn]=await Promise.all([SB.from('boxes').select('*').order('created_at',{ascending:false}),SB.from('box_items').select('*'),SB.from('colors').select('*').order('name_en'),SB.from('item_types').select('*').order('name'),SB.from('storage_locations').select('*').order('name'),SB.from('activity_log').select('*').order('created_at',{ascending:false}),SB.from('profiles').select('*').order('created_at'),SB.from('app_settings').select('*'),SB.from('inventory_snapshots').select('*').order('created_at',{ascending:false})]);
D.boxes=bx.data||[];D.items=it.data||[];D.colors=co.data||[];D.types=ty.data||[];D.locs=lo.data||[];D.logs=lg.data||[];D.profiles=pr.data||[];D.snaps=sn.data||[];D.settings={};(st.data||[]).forEach(s=>D.settings[s.key]=s.value);applyLogo();renderAll()}
function gc(id){return D.colors.find(x=>x.id===id)||{name_en:'Unknown',name_fr:'Inconnu',hex_code:'#6b7280'}}
function gcn(id){const c=gc(id);return lang==='fr'?c.name_fr:c.name_en}
function gch(id){return gc(id).hex_code}
function gtn(id){const x=D.types.find(x=>x.id===id);return x?x.name:'Unknown'}
function gln(id){const l=D.locs.find(x=>x.id===id);return l?l.name:''}
function getEmail(uid){const p=D.profiles.find(x=>x.id===uid);return p?p.email:'?'}
function applyLogo(){const u=D.settings.logo_url;const tl=$('topbarLogo'),ll=$('loginLogo');if(u){tl.src=u;tl.style.display='block';ll&&(ll.innerHTML=`<img src="${u}" style="width:70px;height:70px;border-radius:50%;object-fit:cover;border:2px solid var(--brand);margin-bottom:10px">`)}else{tl.style.display='none';ll&&(ll.innerHTML='')}}

function renderDashPage(){$('page-dashboard').innerHTML=`<div class="page-header"><h2 class="page-title">${t('dashboard')}</h2><button class="btn btn-secondary btn-sm" onclick="exportCSV()">📥 ${t('exportCSV')}</button></div><div id="lowStockAlerts"></div><div class="stats-row"><div class="stat-card"><div class="stat-label">${t('totalItems')}</div><div class="stat-value" id="statTotal">—</div></div><div class="stat-card"><div class="stat-label">${t('boxes')}</div><div class="stat-value" id="statBoxes">—</div></div><div class="stat-card"><div class="stat-label">${t('clean')}</div><div class="stat-value" id="statClean">—</div></div><div class="stat-card"><div class="stat-label">${t('checkedOut')}</div><div class="stat-value" id="statCheckout">—</div></div></div><div class="charts-grid"><div class="chart-card"><h3>${t('stockByType')}</h3><canvas id="chartType"></canvas></div><div class="chart-card"><h3>${t('sizeDistrib')}</h3><canvas id="chartSize"></canvas></div></div><div id="perTypeCharts"></div><div class="charts-grid" style="margin-top:14px"><div class="chart-card"><h3>${t('checkoutBreak')}</h3><canvas id="chartCheckout"></canvas></div><div class="chart-card"><h3>${t('boxStatus')}</h3><canvas id="chartStatus"></canvas></div></div>`}
function loadDash(){
if(!$('statTotal'))return;
const tot=D.items.reduce((s,i)=>s+i.quantity,0);const coTot=D.logs.filter(l=>l.action_type==='checkout').reduce((s,i)=>s+i.quantity,0);const cl=D.boxes.filter(b=>b.status==='clean').length;
$('statTotal').textContent=tot.toLocaleString();$('statBoxes').textContent=D.boxes.length;$('statClean').textContent=cl+'/'+D.boxes.length;$('statCheckout').textContent=coTot.toLocaleString();
Chart.defaults.color=getComputedStyle(document.body).getPropertyValue('--text3').trim()||'#7a8a9a';Chart.defaults.borderColor='rgba(30,42,90,.4)';Chart.defaults.font.family='Outfit';
const thr=parseInt(D.settings.low_stock_threshold)||5;const agg={};
D.items.forEach(i=>{const k=`${i.item_type_id}|${i.color_id}|${i.size}`;if(!agg[k])agg[k]={tid:i.item_type_id,cid:i.color_id,size:i.size,qty:0};agg[k].qty+=i.quantity});
const low=Object.values(agg).filter(a=>a.qty>0&&a.qty<=thr);
$('lowStockAlerts').innerHTML=low.length?`<div class="alert-banner"><h4>⚠ ${low.length} ${t('lowStock')} ${thr}</h4><ul>${low.map(a=>`<li>${gtn(a.tid)} — ${gcn(a.cid)} — ${a.size}: <strong>${a.qty}</strong></li>`).join('')}</ul></div>`:'';
const byT={};D.items.forEach(i=>{byT[gtn(i.item_type_id)]=(byT[gtn(i.item_type_id)]||0)+i.quantity});
rChart('chartType','bar',{labels:Object.keys(byT),datasets:[{data:Object.values(byT),backgroundColor:['#38b6ff','#34d399','#fbbf24','#f87171','#a855f7','#fb923c','#ec4899'],borderRadius:5,borderSkipped:false}]},{pl:false});
const sizes=['XXS','XS','S','M','L','XL','XXL'],byS={};sizes.forEach(s=>byS[s]=0);D.items.forEach(i=>{byS[i.size]=(byS[i.size]||0)+i.quantity});
rChart('chartSize','bar',{labels:sizes,datasets:[{data:sizes.map(s=>byS[s]),backgroundColor:'#38b6ff66',borderColor:'#38b6ff',borderWidth:2,borderRadius:5,borderSkipped:false}]},{pl:false});
const tids=[...new Set(D.items.map(i=>i.item_type_id))];const pe=$('perTypeCharts');
if(tids.length){pe.innerHTML=tids.map((tid,i)=>`<div class="charts-grid" style="margin-top:14px"><div class="chart-card"><h3>${esc(gtn(tid))} — ${t('sizeByColor')}</h3><canvas id="ptSC${i}"></canvas></div><div class="chart-card"><h3>${esc(gtn(tid))} — ${t('colorBreak')}</h3><canvas id="ptCB${i}"></canvas></div></div>`).join('');
tids.forEach((tid,i)=>{const ti=D.items.filter(x=>x.item_type_id===tid);const cd={};ti.forEach(x=>{const cn=gcn(x.color_id);if(!cd[cn])cd[cn]={hex:gch(x.color_id),s:{}};cd[cn].s[x.size]=(cd[cn].s[x.size]||0)+x.quantity});
rChart('ptSC'+i,'bar',{labels:sizes,datasets:Object.entries(cd).map(([n,d])=>({label:n,data:sizes.map(s=>d.s[s]||0),backgroundColor:d.hex,borderRadius:3,borderSkipped:false}))},{stacked:true});
const bc={};ti.forEach(x=>{bc[gcn(x.color_id)]=(bc[gcn(x.color_id)]||0)+x.quantity});
rChart('ptCB'+i,'doughnut',{labels:Object.keys(bc),datasets:[{data:Object.values(bc),backgroundColor:Object.keys(bc).map(n=>{const c=D.colors.find(x=>(lang==='fr'?x.name_fr:x.name_en)===n);return c?c.hex_code:'#6b7280'}),borderWidth:0}]},{cut:55})})}else pe.innerHTML='';
const coB={};D.logs.filter(l=>l.action_type==='checkout').forEach(i=>{coB[gtn(i.item_type_id)]=(coB[gtn(i.item_type_id)]||0)+i.quantity});
const cc=document.getElementById('chartCheckout');if(cc)cc.style.display=Object.keys(coB).length?'block':'none';
if(Object.keys(coB).length)rChart('chartCheckout','bar',{labels:Object.keys(coB),datasets:[{data:Object.values(coB),backgroundColor:['#f87171','#fb923c','#fbbf24','#34d399','#38b6ff','#a855f7'],borderRadius:5,borderSkipped:false}]},{horiz:true,pl:false});
else if(cc)cc.parentElement.insertAdjacentHTML('beforeend',`<p style="color:var(--text3);font-size:13px;text-align:center;padding:30px 0">${t('noCheckouts')}</p>`);
rChart('chartStatus','doughnut',{labels:[t('clean'),t('dirty')],datasets:[{data:[cl,D.boxes.length-cl],backgroundColor:['#34d399','#fb923c'],borderWidth:0}]},{cut:60})}
function rChart(id,type,data,o={}){const c=document.getElementById(id);if(!c)return;if(charts[id])charts[id].destroy();
const scl=type==='bar'?(o.horiz?{x:{beginAtZero:true,grid:{color:'rgba(30,42,90,.3)'}},y:{grid:{display:false}}}:o.stacked?{x:{stacked:true,grid:{display:false}},y:{stacked:true,beginAtZero:true,grid:{color:'rgba(30,42,90,.3)'}}}:{y:{beginAtZero:true,grid:{color:'rgba(30,42,90,.3)'}},x:{grid:{display:false}}}):undefined;
charts[id]=new Chart(c,{type,data,options:{responsive:true,maintainAspectRatio:true,indexAxis:o.horiz?'y':undefined,scales:scl,cutout:o.cut?o.cut+'%':undefined,plugins:{legend:o.pl===false?{display:false}:{position:'bottom',labels:{boxWidth:10,padding:5}}}}})}

rChart('dCB'+i,'doughnut',{labels:Object.keys(bc),datasets:[{data:Object.values(bc),backgroundColor:Object.keys(bc).map(n=>{const c=D.colors.find(x=>(lang==='fr'?x.name_fr:x.name_en)===n);return c?c.hex_code:'#6b7280'}),borderWidth:0}]},{cut:55})})}

function colorDD(id,v){return`<div class="color-select-wrap"><select id="${id}" onchange="document.getElementById('${id}P').style.background=this.options[this.selectedIndex]?.dataset?.hex||'#6b7280'">${D.colors.map(c=>`<option value="${c.id}" data-hex="${c.hex_code}"${c.id===v?' selected':''}>● ${esc(c.name_en)} / ${esc(c.name_fr)}</option>`).join('')}</select><div class="color-preview" id="${id}P" style="background:${v?gch(v):D.colors[0]?.hex_code||'#6b7280'}"></div></div>`}

function openEditItem(id){const i=D.items.find(x=>x.id===id);if(!i)return;editItem=id;$('itemModalInner').innerHTML=`<h2>${t('editItem')}</h2><div class="form-group"><label>${t('type')}</label>${typeDD('itemType',i.item_type_id)}</div><div class="form-group"><label>${t('color')}</label>${colorDD('itemColor',i.color_id)}</div><div class="form-group"><label>${t('size')}</label><select id="itemSize"><option${i.size==='XXS'?' selected':''}>XXS</option><option${i.size==='XS'?' selected':''}>XS</option><option${i.size==='S'?' selected':''}>S</option><option${i.size==='M'?' selected':''}>M</option><option${i.size==='L'?' selected':''}>L</option><option${i.size==='XL'?' selected':''}>XL</option><option${i.size==='XXL'?' selected':''}>XXL</option></select></div><div class="form-group"><label>${t('quantity')}</label><input type="number" id="itemQty" min="0" value="${i.quantity}"></div><div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal('itemModal')">${t('cancel')}</button><button class="btn btn-primary" onclick="saveItem()" id="saveItemBtn" style="width:auto">${t('save')}</button></div>`;openModal('itemModal')}
async function saveItem(){const tid=$('itemType').value,cid=$('itemColor').value,sz=$('itemSize').value,qty=parseInt($('itemQty').value)||0;
if(!editItem){const dup=D.items.find(i=>i.box_id===curBox&&i.item_type_id===tid&&i.color_id===cid&&i.size===sz);
if(dup){pendConf=async()=>{await SB.from('box_items').update({quantity:dup.quantity+qty}).eq('id',dup.id);await SB.from('activity_log').insert({action_type:'item_added',item_type_id:tid,color_id:cid,size:sz,quantity:qty,box_id:curBox,created_by:U.id});toast(t('merged'));closeModal('confirmModal');closeModal('itemModal');lastTID=tid;lastCID=cid;await loadData();openDetail(curBox)};$('confirmText').textContent=`${gtn(tid)} ${gcn(cid)} ${sz} ${t('exists')} (${dup.quantity}). ${t('addToIt')}`;openModal('confirmModal');return}}
const b=$('saveItemBtn');b.innerHTML='<span class="spinner"></span>';b.disabled=1;
if(editItem){await SB.from('box_items').update({item_type_id:tid,color_id:cid,size:sz,quantity:qty}).eq('id',editItem);await SB.from('activity_log').insert({action_type:'item_updated',item_type_id:tid,color_id:cid,size:sz,quantity:qty,box_id:curBox,created_by:U.id});toast(t('updated'))}
else{await SB.from('box_items').insert({box_id:curBox,item_type_id:tid,color_id:cid,size:sz,quantity:qty});await SB.from('activity_log').insert({action_type:'item_added',item_type_id:tid,color_id:cid,size:sz,quantity:qty,box_id:curBox,created_by:U.id});toast(t('saved'));lastTID=tid;lastCID=cid}
b.innerHTML=t('save');b.disabled=0;closeModal('itemModal');await loadData();openDetail(curBox)}
async function delItem(id){const i=D.items.find(x=>x.id===id);pendConf=async()=>{await SB.from('box_items').delete().eq('id',id);if(i)await SB.from('activity_log').insert({action_type:'item_removed',item_type_id:i.item_type_id,color_id:i.color_id,size:i.size,quantity:i.quantity,box_id:curBox,created_by:U.id});toast(t('deleted'));closeModal('confirmModal');await loadData();openDetail(curBox)};$('confirmText').textContent=t('deleteItem');openModal('confirmModal')}
function openBulkModal(){$('bulkModalInner').innerHTML=`<h2>${t('bulkTitle')}</h2><p style="font-size:13px;color:var(--text3);margin-bottom:14px">${t('bulkDesc')}</p><div class="form-group"><label>${t('type')}</label>${typeDD('bulkType',lastTID||D.types[0]?.id)}</div><div class="form-group"><label>${t('color')}</label>${colorDD('bulkColor',lastCID||D.colors[0]?.id)}</div><div class="bulk-sizes">${['XXS','XS','S','M','L','XL','XXL'].map(s=>`<div class="bulk-size-item"><label>${s}</label><input type="number" min="0" value="0" id="bulk_${s}"></div>`).join('')}</div><div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal('bulkModal')">${t('cancel')}</button><button class="btn btn-primary" onclick="saveBulk()" id="bulkBtn" style="width:auto">${t('addAll')}</button></div>`;openModal('bulkModal')}
async function saveBulk(){const tid=$('bulkType').value,cid=$('bulkColor').value;const entries=[];['XXS','XS','S','M','L','XL','XXL'].forEach(s=>{const q=parseInt($('bulk_'+s).value)||0;if(q>0)entries.push({s,q})});
if(!entries.length){toast(t('enterQty'),'error');return}const b=$('bulkBtn');b.innerHTML='<span class="spinner"></span>';b.disabled=1;
for(const e of entries){const dup=D.items.find(i=>i.box_id===curBox&&i.item_type_id===tid&&i.color_id===cid&&i.size===e.s);
if(dup)await SB.from('box_items').update({quantity:dup.quantity+e.q}).eq('id',dup.id);else await SB.from('box_items').insert({box_id:curBox,item_type_id:tid,color_id:cid,size:e.s,quantity:e.q});
await SB.from('activity_log').insert({action_type:'item_added',item_type_id:tid,color_id:cid,size:e.s,quantity:e.q,box_id:curBox,created_by:U.id})}
lastTID=tid;lastCID=cid;b.innerHTML=t('addAll');b.disabled=0;toast(t('saved'));closeModal('bulkModal');await loadData();openDetail(curBox)}

// ===== CHECKOUT =====
function renderCOPage(){$('coTitle').textContent=t('checkout');$('coSearch').placeholder=t('searchItems')}
function renderCO(){renderCOPage();
$('checkoutFilters').innerHTML=`<button class="${coFilter==='all'?'active':''}" onclick="coFilter='all';renderCO()">${t('all')}</button>`+D.types.map(tp=>`<button class="${coFilter===tp.id?'active':''}" onclick="coFilter='${tp.id}';renderCO()">${esc(tp.name)}</button>`).join('');
const search=($('coSearch').value||'').toLowerCase();const agg={};
D.items.forEach(i=>{if(i.quantity<=0)return;const k=`${i.item_type_id}|${i.color_id}|${i.size}`;if(!agg[k])agg[k]={tid:i.item_type_id,cid:i.color_id,size:i.size,qty:0};agg[k].qty+=i.quantity});
let ent=Object.values(agg);if(coFilter!=='all')ent=ent.filter(e=>e.tid===coFilter);
if(search)ent=ent.filter(e=>`${gtn(e.tid)} ${gc(e.cid).name_en} ${gc(e.cid).name_fr} ${e.size}`.toLowerCase().includes(search));
const so={XXS:0,XS:1,S:2,M:3,L:4,XL:5,XXL:6};ent.sort((a,b)=>gtn(a.tid).localeCompare(gtn(b.tid))||gcn(a.cid).localeCompare(gcn(b.cid))||(so[a.size]||0)-(so[b.size]||0));
$('checkoutGrid').innerHTML=ent.length?ent.map(e=>`<div class="checkout-card${e.qty<=0?' out-of-stock':''}" onclick="openQtyModal('${e.tid}','${e.cid}','${e.size}',${e.qty},this)"><div class="cc-flash"></div><div class="cc-type">${gtn(e.tid)}</div><div class="cc-color"><span class="color-dot" style="background:${gch(e.cid)}"></span>${gcn(e.cid)}</div><div class="cc-size">${e.size}</div><div class="cc-qty">${t('stock')}: <span>${e.qty}</span></div></div>`).join(''):`<div class="empty-state"><p>${t('noItems')}</p></div>`}
function openQtyModal(tid,cid,sz,stock,el){qtyCount=1;qtyPending={tid,cid,sz,el};$('qtyVal').textContent=1;$('qtyModalTitle').textContent=`${gtn(tid)} ${gcn(cid)} ${sz}`;openModal('qtyModal')}
function adjQty(d){qtyCount=Math.max(1,qtyCount+d);$('qtyVal').textContent=qtyCount}
async function confirmQty(){if(!qtyPending)return;const{tid,cid,sz,el}=qtyPending;closeModal('qtyModal');
const src=D.items.find(i=>i.item_type_id===tid&&i.color_id===cid&&i.size===sz&&i.quantity>0);
if(!src||src.quantity<qtyCount){toast(t('notEnough'),'error');return}
el.classList.add('flashing');setTimeout(()=>el.classList.remove('flashing'),300);src.quantity-=qtyCount;
const[ur,lr]=await Promise.all([SB.from('box_items').update({quantity:src.quantity}).eq('id',src.id),SB.from('activity_log').insert({action_type:'checkout',item_type_id:tid,color_id:cid,size:sz,quantity:qtyCount,created_by:U.id}).select()]);
if(ur.error){toast(ur.error.message,'error');src.quantity+=qtyCount;return}
lastUndo={bid:src.id,lid:lr.data?.[0]?.id,oq:src.quantity+qtyCount};$('undoBtn').classList.add('show');clearTimeout(window._ut);window._ut=setTimeout(()=>$('undoBtn').classList.remove('show'),10000);
el.querySelector('.cc-qty span').textContent=src.quantity;if(src.quantity<=0)el.classList.add('out-of-stock');qtyPending=null}
async function undoLast(){if(!lastUndo)return;const l=lastUndo;lastUndo=null;$('undoBtn').classList.remove('show');await Promise.all([SB.from('box_items').update({quantity:l.oq}).eq('id',l.bid),l.lid?SB.from('activity_log').delete().eq('id',l.lid):Promise.resolve()]);toast(t('undone'));await loadData();renderCO()}

function renderHistoryPage(){$('page-history').innerHTML=`<div class="page-header"><h2 class="page-title">${t('history')}</h2></div><div class="history-filters"><select id="histAction" onchange="renderHistory()"><option value="">${t('allActions')}</option><option value="checkout">${t('checkout')}</option><option value="item_added">${t('added')}</option><option value="item_removed">${t('removed')}</option></select><input type="date" id="histDate" onchange="renderHistory()"><button class="btn btn-secondary btn-sm" onclick="document.getElementById('histDate').value='';document.getElementById('histAction').value='';renderHistory()">${t('clear')}</button></div><div id="historyList"></div>`}
function renderHistory(){renderHistoryPage();try{const af=$('histAction')?.value;const df=$('histDate')?.value;let logs=[...D.logs];if(af)logs=logs.filter(l=>l.action_type===af);if(df)logs=logs.filter(l=>l.created_at&&l.created_at.startsWith(df));
$('historyList').innerHTML=logs.length?`<div class="items-table-wrap"><table class="items-table"><thead><tr><th>${t('action')}</th><th>${t('type')}</th><th>${t('color')}</th><th>${t('size')}</th><th>${t('qty')}</th><th>${t('by')}</th><th>${t('date')}</th></tr></thead><tbody>${logs.slice(0,200).map(l=>{const cls=l.action_type==='checkout'?'color:var(--red)':'color:var(--accent)';return`<tr><td><span style="${cls};font-weight:600;font-size:12px;text-transform:uppercase">${l.action_type.replace('_',' ')}</span></td><td>${esc(gtn(l.item_type_id))}</td><td><span class="color-dot" style="background:${gch(l.color_id)}"></span>${esc(gcn(l.color_id))}</td><td>${l.size||''}</td><td class="qty">${l.quantity}</td><td style="font-size:12px">${esc(getEmail(l.created_by))}</td><td style="font-size:12px">${new Date(l.created_at).toLocaleString()}</td></tr>`}).join('')}</tbody></table></div>`:`<div class="empty-state"><p>${t('noActivity')}</p><p style="font-size:13px">${t('actionsAppear')}</p></div>`}catch(e){console.error(e)}}

// ===== SNAPSHOTS =====
function renderSnapshotsPage(){$('page-snapshots').innerHTML=`<div class="page-header"><h2 class="page-title">${t('snapshots')}</h2><button class="btn btn-primary btn-sm" onclick="openSnapModal()">📸 ${t('takeSnap')}</button></div><p style="font-size:13px;color:var(--text3);margin-bottom:14px">${t('takeSnapDesc')}</p><div id="snapCompare"></div><div id="snapList"></div>`}
function renderSnaps(){renderSnapshotsPage();const el=$('snapList');const cmp=$('snapCompare');
if(!D.snaps.length){el.innerHTML=`<div class="empty-state"><p>${t('noSnaps')}</p></div>`;return}
if(D.snaps.length>=2){cmp.innerHTML=`<div class="chart-card" style="margin-bottom:14px"><h3>${t('compare')}</h3><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"><select id="snapA" style="flex:1;padding:8px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:Outfit">${D.snaps.map((s,i)=>`<option value="${i}">${esc(s.name)} (${new Date(s.created_at).toLocaleDateString()})</option>`).join('')}</select><select id="snapB" style="flex:1;padding:8px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:Outfit">${D.snaps.map((s,i)=>`<option value="${i}"${i===1?' selected':''}>${esc(s.name)} (${new Date(s.created_at).toLocaleDateString()})</option>`).join('')}</select><button class="btn btn-secondary btn-sm" onclick="compareSnaps()">${t('compare')}</button></div><div id="snapDiff"></div></div>`}
el.innerHTML=D.snaps.map(s=>`<div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center"><div><div style="font-weight:600">${esc(s.name)}</div><span style="font-size:11px;color:var(--text3)">${new Date(s.created_at).toLocaleString()}</span></div><button class="btn-icon" onclick="delSnap('${s.id}')">✕</button></div>`).join('')}
function compareSnaps(){const a=D.snaps[parseInt($('snapA').value)],b=D.snaps[parseInt($('snapB').value)];if(!a||!b)return;
const am={},bm={};a.data.forEach(i=>am[`${i.tid}|${i.cid}|${i.size}`]=i.qty);b.data.forEach(i=>bm[`${i.tid}|${i.cid}|${i.size}`]=i.qty);
const ak=new Set([...Object.keys(am),...Object.keys(bm)]);const rows=[];
ak.forEach(k=>{const[tp,c,s]=k.split('|');const av=am[k]||0,bv=bm[k]||0,d=bv-av;if(d!==0)rows.push({type:gtn(tp),color:gcn(c),hex:gch(c),size:s,a:av,b:bv,diff:d})});
rows.sort((x,y)=>x.type.localeCompare(y.type));
$('snapDiff').innerHTML=rows.length?`<div class="items-table-wrap"><table class="items-table"><thead><tr><th>${t('type')}</th><th>${t('color')}</th><th>${t('size')}</th><th>A</th><th>B</th><th>${t('diff')}</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.type)}</td><td><span class="color-dot" style="background:${r.hex}"></span>${esc(r.color)}</td><td>${r.size}</td><td class="qty">${r.a}</td><td class="qty">${r.b}</td><td class="qty" style="color:${r.diff<0?'var(--red)':r.diff>0?'var(--green)':'var(--text3)'}">${r.diff>0?'+':''}${r.diff}</td></tr>`).join('')}</tbody></table></div>`:`<p style="color:var(--text3)">${t('noDiff')}</p>`}
function openSnapModal(){$('snapModalInner').innerHTML=`<h2>${t('takeSnap')}</h2><div class="form-group"><label>${t('snapName')}</label><input type="text" id="snapName"></div><div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal('snapModal')">${t('cancel')}</button><button class="btn btn-primary" onclick="takeSnap()" id="snapBtn" style="width:auto">${t('save')}</button></div>`;openModal('snapModal')}
async function takeSnap(){const n=$('snapName').value.trim();if(!n){toast(t('name'),'error');return}
const agg={};D.items.forEach(i=>{const k=`${i.item_type_id}|${i.color_id}|${i.size}`;if(!agg[k])agg[k]={tid:i.item_type_id,cid:i.color_id,size:i.size,qty:0};agg[k].qty+=i.quantity});
const b=$('snapBtn');b.innerHTML='<span class="spinner"></span>';b.disabled=1;
await SB.from('inventory_snapshots').insert({name:n,data:Object.values(agg),created_by:U.id});
b.innerHTML=t('save');b.disabled=0;toast(t('saved'));closeModal('snapModal');await loadData();renderSnaps()}
async function delSnap(id){pendConf=async()=>{await SB.from('inventory_snapshots').delete().eq('id',id);toast(t('deleted'));closeModal('confirmModal');await loadData();renderSnaps()};$('confirmText').textContent=t('deleteSnap');openModal('confirmModal')}

// ===== SETTINGS =====
function renderSettingsPage(){$('page-settings').innerHTML=`<div class="page-header"><h2 class="page-title">${t('settings')}</h2></div><div class="settings-tabs"><button class="active" onclick="showSTab('colors',this)">${t('colors')}</button><button onclick="showSTab('types',this)">${t('itemTypes')}</button><button onclick="showSTab('locations',this)">${t('locations')}</button><button onclick="showSTab('users',this)" id="usersTabBtn"${isSA()?'':' style="display:none"'}>${t('users')}</button><button onclick="showSTab('general',this)">${t('general')}</button></div><div class="settings-section active" id="settings-colors"><div class="page-header"><h3 style="font-size:15px;font-weight:600;color:var(--text2)">${t('colors')}</h3><button class="btn btn-secondary btn-sm" onclick="openAddColorModal()">+ ${t('add')}</button></div><div class="colors-grid" id="colorsList"></div></div><div class="settings-section" id="settings-types"><div class="page-header"><h3 style="font-size:15px;font-weight:600;color:var(--text2)">${t('itemTypes')}</h3><button class="btn btn-secondary btn-sm" onclick="openAddTypeModal()">+ ${t('add')}</button></div><div class="types-grid" id="typesList"></div></div><div class="settings-section" id="settings-locations"><div class="page-header"><h3 style="font-size:15px;font-weight:600;color:var(--text2)">${t('locations')}</h3><button class="btn btn-secondary btn-sm" onclick="openAddLocModal()">+ ${t('add')}</button></div><div class="locations-grid" id="locList"></div></div><div class="settings-section" id="settings-users"><div class="page-header"><h3 style="font-size:15px;font-weight:600;color:var(--text2)">${t('users')}</h3></div><div id="pendingUsers"></div><div class="users-grid" id="usersList"></div></div><div class="settings-section" id="settings-general"><div style="max-width:400px"><div class="form-group"><label>${t('logoUrl')}</label><input type="text" id="sLogo" value="${esc(D.settings.logo_url||'')}"></div><div class="form-group"><label>${t('threshold')}</label><input type="number" id="sThreshold" min="1" value="${D.settings.low_stock_threshold||'5'}"></div><button class="btn btn-primary" onclick="saveSettings()" style="width:auto;margin-top:8px">${t('save')}</button></div></div>`}
function renderSettingsContent(){renderSettingsPage();renderColors();renderTypes();renderLocs();if(isSA())renderUsers()}
function showSTab(tab,btn){document.querySelectorAll('.settings-section').forEach(s=>s.classList.remove('active'));$('settings-'+tab)?.classList.add('active');document.querySelectorAll('.settings-tabs button').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}
function renderColors(){const el=$('colorsList');if(!el)return;el.innerHTML=D.colors.map(c=>`<div class="color-card"><div class="color-swatch" style="background:${c.hex_code}"></div><div class="color-names"><div class="en">${esc(c.name_en)}</div><div class="fr">${esc(c.name_fr)}</div></div><button class="btn-icon" onclick="openEditColor('${c.id}')">✎</button><button class="btn-icon" onclick="delColor('${c.id}')">✕</button></div>`).join('')}
function openAddColorModal(){editColor=null;$('colorModalInner').innerHTML=`<h2>${t('add')} ${t('color')}</h2><div class="form-group"><label>${t('english')}</label><input type="text" id="colorEn"></div><div class="form-group"><label>${t('french')}</label><input type="text" id="colorFr"></div><div class="form-group"><label>${t('color')}</label><input type="color" id="colorHex" value="#3b82f6" style="height:44px;padding:3px;cursor:pointer;width:100%"></div><div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal('colorModal')">${t('cancel')}</button><button class="btn btn-primary" onclick="saveColor()" id="saveColorBtn" style="width:auto">${t('save')}</button></div>`;openModal('colorModal')}
function openEditColor(id){const c=D.colors.find(x=>x.id===id);if(!c)return;editColor=id;$('colorModalInner').innerHTML=`<h2>${t('edit')}</h2><div class="form-group"><label>${t('english')}</label><input type="text" id="colorEn" value="${esc(c.name_en)}"></div><div class="form-group"><label>${t('french')}</label><input type="text" id="colorFr" value="${esc(c.name_fr)}"></div><div class="form-group"><label>${t('color')}</label><input type="color" id="colorHex" value="${c.hex_code}" style="height:44px;padding:3px;cursor:pointer;width:100%"></div><div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal('colorModal')">${t('cancel')}</button><button class="btn btn-primary" onclick="saveColor()" id="saveColorBtn" style="width:auto">${t('save')}</button></div>`;openModal('colorModal')}
async function saveColor(){const en=$('colorEn').value.trim(),fr=$('colorFr').value.trim(),hx=$('colorHex').value;if(!en||!fr){toast(t('name'),'error');return}const b=$('saveColorBtn');b.innerHTML='<span class="spinner"></span>';b.disabled=1;if(editColor)await SB.from('colors').update({name_en:en,name_fr:fr,hex_code:hx}).eq('id',editColor);else await SB.from('colors').insert({name_en:en,name_fr:fr,hex_code:hx});b.innerHTML=t('save');b.disabled=0;toast(t('saved'));closeModal('colorModal');await loadData()}
async function delColor(id){pendConf=async()=>{await SB.from('colors').delete().eq('id',id);toast(t('deleted'));closeModal('confirmModal');await loadData()};$('confirmText').textContent=t('deleteColor');openModal('confirmModal')}
function renderTypes(){const el=$('typesList');if(!el)return;el.innerHTML=D.types.map(tp=>`<div class="type-card"><div class="type-name">${esc(tp.name)}</div><div style="display:flex;gap:4px"><button class="btn-icon" onclick="openEditType('${tp.id}')">✎</button><button class="btn-icon" onclick="delType('${tp.id}')">✕</button></div></div>`).join('')}
function openAddTypeModal(){editType=null;$('typeModalInner').innerHTML=`<h2>${t('add')} ${t('type')}</h2><div class="form-group"><label>${t('name')}</label><input type="text" id="typeName"></div><div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal('typeModal')">${t('cancel')}</button><button class="btn btn-primary" onclick="saveType()" id="saveTypeBtn" style="width:auto">${t('save')}</button></div>`;openModal('typeModal')}
function openEditType(id){const tp=D.types.find(x=>x.id===id);if(!tp)return;editType=id;$('typeModalInner').innerHTML=`<h2>${t('edit')}</h2><div class="form-group"><label>${t('name')}</label><input type="text" id="typeName" value="${esc(tp.name)}"></div><div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal('typeModal')">${t('cancel')}</button><button class="btn btn-primary" onclick="saveType()" id="saveTypeBtn" style="width:auto">${t('save')}</button></div>`;openModal('typeModal')}
async function saveType(){const n=$('typeName').value.trim();if(!n){toast(t('name'),'error');return}const b=$('saveTypeBtn');b.innerHTML='<span class="spinner"></span>';b.disabled=1;if(editType)await SB.from('item_types').update({name:n}).eq('id',editType);else await SB.from('item_types').insert({name:n});b.innerHTML=t('save');b.disabled=0;toast(t('saved'));closeModal('typeModal');await loadData()}
async function delType(id){pendConf=async()=>{await SB.from('item_types').delete().eq('id',id);toast(t('deleted'));closeModal('confirmModal');await loadData()};$('confirmText').textContent=t('deleteType');openModal('confirmModal')}
function renderLocs(){const el=$('locList');if(!el)return;el.innerHTML=D.locs.map(l=>`<div class="loc-card"><div class="loc-info"><div class="loc-name">${esc(l.name)}</div>${l.description?`<div class="loc-desc">${esc(l.description)}</div>`:''}</div><div style="display:flex;gap:4px"><button class="btn-icon" onclick="openEditLoc('${l.id}')">✎</button><button class="btn-icon" onclick="delLoc('${l.id}')">✕</button></div></div>`).join('')}
function openAddLocModal(){editLoc=null;$('locModalInner').innerHTML=`<h2>${t('add')} ${t('location')}</h2><div class="form-group"><label>${t('name')}</label><input type="text" id="locName"></div><div class="form-group"><label>${t('description')}</label><input type="text" id="locDesc"></div><div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal('locModal')">${t('cancel')}</button><button class="btn btn-primary" onclick="saveLoc()" id="saveLocBtn" style="width:auto">${t('save')}</button></div>`;openModal('locModal')}
function openEditLoc(id){const l=D.locs.find(x=>x.id===id);if(!l)return;editLoc=id;$('locModalInner').innerHTML=`<h2>${t('edit')}</h2><div class="form-group"><label>${t('name')}</label><input type="text" id="locName" value="${esc(l.name)}"></div><div class="form-group"><label>${t('description')}</label><input type="text" id="locDesc" value="${esc(l.description||'')}"></div><div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal('locModal')">${t('cancel')}</button><button class="btn btn-primary" onclick="saveLoc()" id="saveLocBtn" style="width:auto">${t('save')}</button></div>`;openModal('locModal')}
async function saveLoc(){const n=$('locName').value.trim(),d=$('locDesc').value.trim();if(!n){toast(t('name'),'error');return}const b=$('saveLocBtn');b.innerHTML='<span class="spinner"></span>';b.disabled=1;if(editLoc)await SB.from('storage_locations').update({name:n,description:d||null}).eq('id',editLoc);else await SB.from('storage_locations').insert({name:n,description:d||null});b.innerHTML=t('save');b.disabled=0;toast(t('saved'));closeModal('locModal');await loadData()}
async function delLoc(id){pendConf=async()=>{await SB.from('storage_locations').delete().eq('id',id);toast(t('deleted'));closeModal('confirmModal');await loadData()};$('confirmText').textContent=t('deleteLoc');openModal('confirmModal')}
function renderUsers(){if(!isSA())return;const pend=D.profiles.filter(p=>p.role==='pending'),act=D.profiles.filter(p=>p.role!=='pending');const pu=$('pendingUsers');if(!pu)return;
pu.innerHTML=pend.length?`<div class="alert-banner" style="margin-bottom:14px"><h4>⏳ ${pend.length} ${t('pending').toLowerCase()}</h4><div class="users-grid" style="margin-top:10px">${pend.map(p=>`<div class="user-card"><div class="user-info"><div class="user-email">${esc(p.email)}</div><span class="role-badge role-pending">${t('pending')}</span></div><div style="display:flex;gap:4px"><button class="btn btn-sm" style="background:var(--green-dim);color:var(--green);border:1px solid rgba(52,211,153,.2)" onclick="approveU('${p.id}')">✓</button><button class="btn btn-danger btn-sm" onclick="declineU('${p.id}')">✕</button></div></div>`).join('')}</div></div>`:'';
$('usersList').innerHTML=act.map(p=>`<div class="user-card"><div class="user-info"><div class="user-email">${esc(p.email)}</div><span class="role-badge role-${p.role==='super_admin'?'super':'admin'}">${p.role.replace('_',' ')}</span></div>${p.id!==U.id&&p.role!=='super_admin'?`<button class="btn-icon" onclick="removeU('${p.id}')">✕</button>`:''}</div>`).join('')}
async function approveU(id){await SB.from('profiles').update({role:'admin'}).eq('id',id);toast(t('saved'));await loadData()}
async function declineU(id){pendConf=async()=>{await SB.from('profiles').delete().eq('id',id);toast(t('deleted'));closeModal('confirmModal');await loadData()};$('confirmText').textContent=t('declineUser');openModal('confirmModal')}
async function removeU(id){pendConf=async()=>{await SB.from('profiles').delete().eq('id',id);toast(t('deleted'));closeModal('confirmModal');await loadData()};$('confirmText').textContent=t('removeUser');openModal('confirmModal')}
async function saveSettings(){await Promise.all([SB.from('app_settings').update({value:$('sLogo').value.trim()}).eq('key','logo_url'),SB.from('app_settings').update({value:$('sThreshold').value}).eq('key','low_stock_threshold')]);toast(t('saved'));await loadData()}
function exportCSV(){let csv='Type,Color,Size,Quantity,Box,Location\n';D.items.forEach(i=>{const b=D.boxes.find(x=>x.id===i.box_id);csv+=`"${gtn(i.item_type_id)}","${gcn(i.color_id)}","${i.size}",${i.quantity},"${b?b.name:''}","${b?gln(b.location_id):''}" \n`});const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`asb_inventory_${new Date().toISOString().split('T')[0]}.csv`;a.click();toast(t('exported'))}

// ===== HELPERS =====
function openModal(id){$(id).classList.add('show')}
function closeModal(id){$(id).classList.remove('show')}
function confirmAction(){if(pendConf)pendConf()}
document.querySelectorAll('.modal-overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('show')}));
function toast(m,tp='success'){const e=$('toast');e.textContent=m;e.className='toast toast-'+tp+' show';setTimeout(()=>e.classList.remove('show'),3000)}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}

// ===== INIT =====
renderLogin();renderPending();renderConfirm();
$('langBtn').textContent=lang==='en'?'FR':'EN';
checkSession();
</script>
</body></html>
