name: Calc209 APK Build

on:
  pull_request:
    branches:
      - calc209-build-base-20260928

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode Calc209 source
        shell: bash
        run: |
          base64 -d calc209-src.b64 > calc209.zip
          unzip -q calc209.zip

      - name: Ensure Android API 35 is installed
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        shell: bash
        run: |
          cd Calc209
          gradle --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Calc209-v1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Calc209-APK
          path: Calc209-v1.0.apk
          if-no-files-found: error
